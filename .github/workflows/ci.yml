name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the app derives its alpha version from the commit count.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        # Runners preinstall the SDK; the third-party setup action kept
        # failing on cmdline-tools download, so use the preinstalled image
        # SDK directly: accept licenses and ensure the compile platform.
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Run lint
        run: ./gradlew lint

      - name: Run detekt
        run: ./gradlew detekt

      - name: Check public API surface
        run: ./gradlew apiCheck

      - name: Assemble debug AARs
        run: ./gradlew assembleDebug
